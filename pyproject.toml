[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breach-toolkit"
version = "1.0.0"
description = "Open-source credential breach detection toolkit using k-anonymity"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Cameron Hopkin", email = "cameron@example.com"}
]
keywords = ["security", "breach", "credentials", "hibp", "password", "k-anonymity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.8.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
]

[project.scripts]
breach-toolkit = "breach_toolkit.cli:cli"

[project.urls]
Homepage = "https://github.com/cameronhopkin/breach-toolkit"
Documentation = "https://github.com/cameronhopkin/breach-toolkit#readme"
Repository = "https://github.com/cameronhopkin/breach-toolkit.git"
Issues = "https://github.com/cameronhopkin/breach-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "S"]
ignore = [
    "S101",  # Allow assert (used in tests)
    "E501",  # Line length handled separately; some lines (HTML template literals, hash chains) don't split cleanly
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S105",  # Hardcoded password strings are test fixtures
    "S106",  # Hardcoded password kwargs are test fixtures
    "S324",  # SHA-1 is required by HIBP API and must be exercised in tests
]

[tool.mypy]
# Python 3.9 reached EOL in October 2025; mypy >= 1.10 refuses anything below 3.10.
python_version = "3.10"
# Existing codebase predates strict typing; new code should still aim for types
# but legacy modules are not annotated. Re-enable as the codebase is typed up.
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Skip assert warnings
